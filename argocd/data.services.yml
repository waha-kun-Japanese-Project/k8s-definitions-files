apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/waha-kun-Japanese-Project/k8s-definitions-files.git
    targetRevision: main
    path: data-services
  destination:
    server: https://kubernetes.default.svc
    namespace: data-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true