apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
  namespace: backend
  labels:
    app: community
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community
  template:
    metadata:
      labels:
        app: community
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: community
          image: mohamedelsawyy/communityservice:latest   # tag is bumped by the CI workflow
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Jwt__Issuer
              value: "WAHAKUN.Auth"
            - name: Jwt__Audience
              value: "WAHAKUN.Client"
            - name: Jwt__Expiry
              value: "60"
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: signing-key
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: password
            - name: ConnectionStrings__SQLConnection
              value: "Server=sql-server.data-services.svc.cluster.local,1433;Database=IssueDb;User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=True;"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: ConnectionStrings__RedisConnection
              value: "redis.data-services.svc.cluster.local:6379,password=$(REDIS_PASSWORD)"
            # TODO: point this at the real moderation service once it is deployed (appsettings uses localhost:8000)
            - name: ModerationService__BaseUrl
              value: "http://moderation-service.backend.svc.cluster.local/"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: community-service
  namespace: backend
spec:
  selector:
    app: community
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30090
  type: NodePort