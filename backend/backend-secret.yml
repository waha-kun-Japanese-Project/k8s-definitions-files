# Both AuthService and NotificationService call FirebaseApp.Create() with NO
# null-check at startup - if the mounted file isn't at exactly this path with
# exactly this filename, the pod crash-loops before it even binds to a port.
#
# WARNING: the real key for auth-firebase-adminsdk was found committed in
# plaintext in the app repo (AuthService/AuthService/FireBase/graduation-project-3c67f-...json).
# ROTATE that key in the Firebase console before using it here - treat the
# committed one as compromised. Fill in the real (rotated) JSON below and
# apply directly with kubectl (kept OUT of git), or use Sealed Secrets/SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: auth-firebase-secret
  namespace: backend
type: Opaque
stringData:
  # Key name must exactly match the filename AuthService/AuthService/Program.cs
  # hardcodes: "FireBase/graduation-project-3c67f-firebase-adminsdk-fbsvc-b88880ea28.json"
  graduation-project-3c67f-firebase-adminsdk-fbsvc-b88880ea28.json: "firebase-adminsdk-fbsvc@graduation-project-3c67f.iam.gserviceaccount.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-firebase-secret
  namespace: backend
type: Opaque
stringData:
  # Key name must exactly match what NotificationService/Program.cs hardcodes:
  # "Firebase/firebase-adminsdk.json" - this file was never committed at all,
  # so NotificationService has been crashing on startup regardless of k8s config
  # until this Secret exists.
  firebase-adminsdk.json: |
    "firebase-adminsdk-fbsvc@graduation-project-3c67f.iam.gserviceaccount.com"
