apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-ai-deployment
  namespace: backend
  labels:
    app: vision-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-ai
  template:
    metadata:
      labels:
        app: vision-ai
    spec:
      containers:
        - name: vision-ai
          image: vision-ai:1.0
          ports:
            - containerPort: 8080

          env:
            # SQL Server
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: password
            - name: ConnectionStrings__SQLConnection
              value: "Server=sql-server.data-services.svc.cluster.local,1433;Database=AuthDb;User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=True;"

            # Redis (now password-protected)
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: ConnectionStrings__RedisConnection
              value: "redis.data-services.svc.cluster.local:6379,password=$(REDIS_PASSWORD)"

            # JWT — separate secret, not the SQL one (per earlier fix)
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: signing-key

