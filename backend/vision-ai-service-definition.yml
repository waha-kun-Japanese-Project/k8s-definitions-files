apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionapi-service
  namespace: backend
  labels:
    app: vision-ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vision-ai-api
  template:
    metadata:
      labels:
        app: vision-ai-api
    spec:
      containers:
        - name: vision-ai-api
          image: mohamedelsawyy/visionservice:1.0
          command: ["uvicorn", "VisionService.API.app:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "vision-service"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8001"
            - name: DEBUG
              value: "false"
            - name: MODEL_PATH
              value: "models/efficientnet_waha_kun.keras"
            - name: CONFIDENCE_THRESHOLD
              value: "50.0"
            - name: UPLOAD_FOLDER
              value: "uploads"
            - name: MAX_FILE_SIZE
              value: "10485760"
            - name: QUALITY_CHECK_ENABLED
              value: "true"
            - name: ENHANCE_IMAGE_ENABLED
              value: "true"
            - name: RABBITMQ_HOST
              value: "rabbitmq.data-services.svc.cluster.local"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
          resources:
            # TensorFlow + the .keras model held in memory needs more room
            # than the .NET services get
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vision-ai-api-service
  namespace: backend
spec:
  selector:
    app: vision-ai-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vision-ai-api-hpa
  namespace: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vision-ai-api-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0