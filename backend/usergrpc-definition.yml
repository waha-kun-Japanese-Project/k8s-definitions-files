apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-grpc-service
  namespace: backend
  labels:
    app: user-grpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-grpc
  template:
    metadata:
      labels:
        app: user-grpc
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-grpc
          image: mohamedelsawyy/usergrpcservice:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: password
            - name: ConnectionStrings__SQLConnection
              value: "Server=sql-server.data-services.svc.cluster.local,1433;Database=UserDb;User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=True;"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: user-grpc-service
  namespace: backend
spec:
  selector:
    app: user-grpc
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP