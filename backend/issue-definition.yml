apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-service
  namespace: backend
  labels:
    app: issue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issue
  template:
    metadata:
      labels:
        app: issue
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issue
          image: mohamedelsawyy/issueservice:f8af08d
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Jwt__Issuer
              value: "WAHAKUN.Auth"
            - name: Jwt__Audience
              value: "WAHAKUN.Client"
            - name: Jwt__Expiry
              value: "60"
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: auth-jwt-secret
                  key: signing-key
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: password
            - name: ConnectionStrings__SQLConnection
              value: "Server=sql-server.data-services.svc.cluster.local,1433;Database=IssueDb;User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=True;"
            - name: ConnectionStrings__HangfireConnection
              value: "Server=sql-server.data-services.svc.cluster.local,1433;Database=HangfireDb;User Id=$(DB_USER);Password=$(DB_PASSWORD);TrustServerCertificate=True;Encrypt=True;"
            - name: Hangfire__DashboardUser
              valueFrom:
                secretKeyRef:
                  name: hangfire-dashboard-secret
                  key: username
            - name: Hangfire__DashboardPassword
              valueFrom:
                secretKeyRef:
                  name: hangfire-dashboard-secret
                  key: password
            - name: Grpc__UserServiceUrl
              value: "http://user-grpc-service.backend.svc.cluster.local:8081"
            - name: Grpc__MediaStorageUrl
              value: "http://media-grpc-service.backend.svc.cluster.local:8081"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
            - name: RabbitMq__Host
              value: "rabbitmq.data-services.svc.cluster.local"
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__Username
              value: "$(RABBITMQ_USER)"
            - name: RabbitMq__Password
              value: "$(RABBITMQ_PASSWORD)"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: issue-service
  namespace: backend
spec:
  selector:
    app: issue
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30130
  type: NodePort

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: issue-hpa
  namespace: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: issue-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0